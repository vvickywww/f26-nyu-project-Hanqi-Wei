<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START BELOW -->
     
<!--PAGE HEADER-->
<header>
  <h1>Don't just practice your presentation. Practice the unexpected.</h1>
</header>

<!-- MAIN CONTENT -->
<main>

  <!-- UPLOAD SLIDES SECTION -->
  <div class="setup-grid">
    <section id="setup" class="setup-card">
      <h2>Upload slides</h2>
      <p>Choose a presentation file, or practice without slides.</p>
      <button type="button">Upload from files</button>
      <button type="button">Practice without slides</button>
    </section>

  <!-- TIMER SECTION -->
  <section>
      <h2>Set a timer</h2>
      <label for="practice-time">Practice time in minutes</label>
      <input id="practice-time" name="practice-time" type="number" min="1" placeholder="e.g. 15">
    </section>

  <!-- PRESENTATION TYPE SECTION -->
   <section>
  <h2>Choose a presentation setting</h2>
    <button type="button">Class presentation</button>
    <button type="button">Pitch</button>
    <button type="button">Thesis / Research</button>
    <button type="button">Others</button>
  </section>
</div>
  
  <!-- START PRACTICE SECTION -->
   <section>
  <h2>Ready to start?</h2>
    <p>When your settings are ready, begin your practice session.</p>
    <a href="practice.html">Start Practice</a>
  </section>

</main>   
  </body>
</html>
